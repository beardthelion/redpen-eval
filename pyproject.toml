[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redpen"
version = "0.1.0"
description = "Benchmark for AI code reviewers on real CVE-derived vulnerabilities"
requires-python = ">=3.10"
dependencies = [
    "semgrep>=1.177.0,<1.178",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
redpen = "redpen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["redpen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
