default_judge: mock
reviewers:
  mock:
    adapter: mock
    vuln: hit          # hit | partial | miss | empty | error
    fixed: clean       # clean | fp | empty | error
    overrides: {}      # {"<case_id>": {"vuln": "...", "fixed": "..."}}
  reviewer-a:
    adapter: openai_compat
    base_url: https://api.aimlapi.com/v1
    model: x-ai/grok-4-7
    api_key_env: AIMLAPI_API_KEY
    temperature: 0
    max_tokens: 65536
    max_tokens_param: max_tokens   # or max_completion_tokens
    seed: 1
    timeout_s: 900
    max_retries: 2
    retry_backoff_s: 1.0
  reviewer-b:
    adapter: openai_compat
    base_url: https://api.aimlapi.com/v1
    model: google/gemini-3.1-pro-preview
    api_key_env: AIMLAPI_API_KEY
    temperature: 0
    max_tokens: 65536
    max_tokens_param: max_tokens   # or max_completion_tokens
    seed: 1
    timeout_s: 900
    max_retries: 2
    retry_backoff_s: 1.0
judges:
  mock:
    adapter: mock
    malformed_cases: []   # case ids whose judge output is always invalid
    repair_cases: []      # case ids whose first judge output is invalid, second valid
  llm:
    adapter: openai_compat
    base_url: https://api.aimlapi.com/v1
    model: anthropic/claude-sonnet-5-5
    api_key_env: AIMLAPI_API_KEY
    temperature: 0
    max_tokens: 1024
    structured_output: json_schema   # json_schema | json_object | prompt
